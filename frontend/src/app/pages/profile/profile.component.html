<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <div *ngIf="user; else loading">
      <div class="flex items-center justify-center mb-6">
        <div class="rounded-full h-24 w-24 bg-gray-300 flex items-center justify-center overflow-hidden">
          <img *ngIf="user.profilePicture" [src]="user.profilePicture" alt="Profile Picture" class="object-cover h-full w-full">
          <svg *ngIf="!user.profilePicture" xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
      </div>

      <h2 class="text-2xl font-semibold mb-4 text-center">Welcome, {{ user.name }} 👋</h2>
      <div class="mb-4">
        <p class="text-gray-700 font-semibold">Email:</p>
        <p class="text-gray-600">{{ user.email }}</p>
      </div>

      <div class="mb-4">
        <p class="text-gray-700 font-semibold">Username:</p>
        <p class="text-gray-600">{{ user.username || 'Not available' }}</p>
      </div>

      <div class="mb-6">
        <p class="text-gray-700 font-semibold">Location:</p>
        <p class="text-gray-600">{{ user.location || 'Not specified' }}</p>
      </div>

      <button (click)="logout()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded font-semibold focus:outline-none focus:ring focus:border-red-300">
        Logout
      </button>
    </div>

    <ng-template #loading>
      <div class="flex items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500"></div>
      </div>
      <p class="mt-4 text-center">Loading your profile...</p>
    </ng-template>
  </div>
</div>
