<div class="cart p-6 bg-white shadow-lg rounded-lg max-w-lg mx-auto">
  <h2 class="text-2xl font-bold mb-4 text-gray-800">Shopping Cart</h2>

  <div *ngIf="cartItems.length === 0" class="text-center text-gray-500">
    <p class="text-lg">🛒 Your cart is empty</p>
  </div>

  <div *ngFor="let item of cartItems" class="cart-item flex items-center gap-4 p-4 border-b">
    <img [src]="item.image_url" alt="{{ item.name }}" class="w-16 h-16 object-cover rounded" />
    <div class="flex-1">
      <h3 class="text-lg font-semibold">{{ item.name }}</h3>
      <p class="text-gray-700"><strong>₹{{ item.price }}</strong></p>
    </div>
    <button (click)="removeFromCart(item.product_id)" 
            class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 transition">
      Remove
    </button>
  </div>

  <div *ngIf="cartItems.length > 0" class="mt-4">
    <h3 class="text-xl font-semibold">Total: ₹{{ total }}</h3>
    <button [disabled]="cartItems.length === 0" 
            class="mt-3 w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed transition">
      Proceed to Checkout
    </button>
  </div>
</div>
